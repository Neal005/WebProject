<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Detector - Redirecting...</title>
    <script>
      var path = window.location.pathname;
      if (!path.endsWith('/')) {
        path += '/';
      }
      window.location.replace(path + 'dist/index.html' + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>Redirecting... <a id="redirect-link" href="./dist/index.html">Click here if not redirected</a></p>
    <script>
      var link = document.getElementById('redirect-link');
      if (link) {
        var path = window.location.pathname;
        if (!path.endsWith('/')) path += '/';
        link.href = path + 'dist/index.html' + window.location.search + window.location.hash;
      }
    </script>
  </body>
</html>
