name: Deploy static website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: static/ai-detector/package.json

      - name: Install Dependencies
        run: npm ci
        working-directory: static/ai-detector

      - name: Build Static Project
        run: npm run build
        working-directory: static/ai-detector

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: static/ai-detector/dist
          branch: gh-pages
          clean: true
